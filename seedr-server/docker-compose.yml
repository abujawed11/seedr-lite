services:
  aria2:
    build:
      context: .
      dockerfile: Dockerfile.aria2
    user: "1000:1000"
    environment:
      - ARIA2_SECRET=${ARIA2_SECRET:-seedr_aria2_secret}
      - ARIA2_RPC_PORT=${ARIA2_PORT:-6800}
      - ARIA2_DOWNLOAD_DIR=/downloads
    ports:
      - "${ARIA2_PORT:-6800}:6800"
    volumes:
      # Maps host storage dir → /downloads inside the container
      # aria2 writes here; Node.js reads from the same host path
      # Update the left side to match ROOT in your .env (e.g. ./srv/storage/library)
      - ${ROOT:-./src/storage/library}:/downloads
      # Persist DHT routing table so it doesn't error on every restart
      - aria2-cache:/root/.cache/aria2
    restart: unless-stopped

volumes:
  aria2-cache:
